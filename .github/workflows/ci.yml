name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Without this block GITHUB_TOKEN inherits whatever the repo or org default
# happens to be — which on older defaults is write access to contents, packages,
# deployments and more. This job only ever needs to read the checkout, so it says
# so explicitly rather than depending on a settings page nobody will re-check.
# That matters more once the repo is public and accepting fork PRs.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the Node major Vercel builds with. CI testing on a different
          # major to the one production runs is a silent source of "works in CI,
          # breaks on deploy" — and Node 20 went end-of-life in April 2026, so it
          # no longer receives security patches at all.
          node-version: 24
          cache: npm

      # Before `npm ci`: it needs no dependencies, takes milliseconds, and a
      # failure here means a privacy leak is already in the diff — worth knowing
      # before spending three minutes on the rest of the pipeline.
      - name: Check assets for embedded metadata
        run: npm run check:assets

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Runs last: it is by far the slowest step, so the cheap checks above should
      # fail first. `next build` pre-renders the Work section and every
      # `work/[slug]` route, which means it really fetches from Contentful — so it
      # needs delivery credentials or `fetchEntries` throws (see cms/contentful.ts).
      #
      # Secrets are scoped to this single step rather than the job, so no earlier
      # step (or anything they shell out to) can read them.
      #
      # NEXT_PUBLIC_SITE_URL is deliberately left unset: it falls back to localhost,
      # which is the intended safe default. Nothing is deployed from here.
      - name: Build
        run: npm run build
        env:
          # Not a secret — the space ID is already published in the committed
          # .env.example. Storing non-secrets as secrets creates false confidence
          # and muddies rotation, so it stays inline.
          CONTENTFUL_SPACE_ID: 98ddc4l0fmm4
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}

      # Only Chromium, not all three engines Playwright ships by default —
      # this is a single axe-core scan, not a cross-browser e2e suite.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Priced honestly (see test/a11y/site.spec.ts): axe-core is a new
      # runtime dependency with its own CVE stream, on a pipeline that had
      # none before this. `npm run test:a11y` starts `npm run start` against
      # the `.next` build from the step above (no rebuild) and runs axe
      # against the homepage plus one live work/experience detail page each.
      #
      # `continue-on-error: true`, deliberately: the first real run of this
      # check against the live site found genuine, pre-existing findings
      # (systemic color-contrast on translucent text tokens, one heading-
      # order skip) that predate this workflow and are a content/design call,
      # not something this ticket should silently paper over or unilaterally
      # "fix" by force. Flipping this to blocking is the correct next step
      # once those are triaged — until then, a hard-blocking CI check that's
      # red from the day it's merged teaches people to ignore it, which is
      # worse than not having it (see upgrade-deps/SKILL.md's identical
      # argument against noisy Dependabot PRs). The job still runs and its
      # output is visible on every PR either way.
      #
      # IMPORTANT CAVEAT, repeated wherever this check is referenced: a green
      # run here is not proof of accessibility compliance. Automated tooling
      # like axe-core catches roughly a third of real issues — see
      # .claude/skills/a11y-audit/SKILL.md for the invariants (runtime
      # motion-preference gating) it structurally cannot see.
      - name: Accessibility check (axe-core)
        run: npm run test:a11y
        continue-on-error: true
        env:
          CONTENTFUL_SPACE_ID: 98ddc4l0fmm4
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
