name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm

      # Before `npm ci`: it needs no dependencies, takes milliseconds, and a
      # failure here means a privacy leak is already in the diff — worth knowing
      # before spending three minutes on the rest of the pipeline.
      - name: Check assets for embedded metadata
        run: npm run check:assets

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Runs last: it is by far the slowest step, so the cheap checks above should
      # fail first. `next build` pre-renders the Work section and every
      # `work/[slug]` route, which means it really fetches from Contentful — so it
      # needs delivery credentials or `fetchEntries` throws (see cms/contentful.ts).
      #
      # Secrets are scoped to this single step rather than the job, so no earlier
      # step (or anything they shell out to) can read them.
      #
      # NEXT_PUBLIC_SITE_URL is deliberately left unset: it falls back to localhost,
      # which is the intended safe default. Nothing is deployed from here.
      - name: Build
        run: npm run build
        env:
          # Not a secret — the space ID is already published in the committed
          # .env.example. Storing non-secrets as secrets creates false confidence
          # and muddies rotation, so it stays inline.
          CONTENTFUL_SPACE_ID: 98ddc4l0fmm4
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
